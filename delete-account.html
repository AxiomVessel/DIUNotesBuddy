<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Delete Account | DIU Notes Buddy</title>
    <meta name="description" content="Account deletion instructions for DIU Notes Buddy.">
    <style>
        :root {
            color-scheme: light;
            --bg: #f6f7fb;
            --card: #ffffff;
            --text: #1f2937;
            --muted: #6b7280;
            --accent: #2563eb;
            --border: #e5e7eb;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            padding: 24px;
            font-family: Arial, Helvetica, sans-serif;
            background: linear-gradient(180deg, #eef2ff 0%, var(--bg) 100%);
            color: var(--text);
        }

        main {
            width: 100%;
            max-width: 720px;
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 20px;
            padding: 32px;
            box-shadow: 0 18px 50px rgba(15, 23, 42, 0.08);
        }

        h1 {
            margin: 0 0 16px;
            font-size: clamp(1.8rem, 4vw, 2.4rem);
            line-height: 1.15;
        }

        p {
            margin: 0;
            font-size: 1.05rem;
            line-height: 1.7;
            color: var(--text);
        }

        a {
            color: var(--accent);
            text-decoration: none;
        }

        a:hover {
            text-decoration: underline;
        }

        .note {
            margin-top: 18px;
            color: var(--muted);
            font-size: 0.95rem;
        }
    </style>
</head>
<body>
    <main>
        <h1>Delete Your Account</h1>
        <p>To delete your account and data, open the app and use the in-app deletion feature. If you no longer have the app, email <a href="mailto:oceanmallik@oceanmallik.com">oceanmallik@oceanmallik.com</a> with the subject 'Delete Account'.</p>
        <p class="note">This page is provided for Google Play account deletion requirements.</p>
    </main>
</body>
</html>
